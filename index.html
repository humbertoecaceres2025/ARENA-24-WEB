<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO ARENA 24</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle, #252525 0%, #090909 55%, #000 100%);
    font-family: Arial, sans-serif;
}

.player {
    width: 390px;
    max-width: 94%;
    padding: 25px;
    text-align: center;
    color: white;
    border-radius: 28px;
    background: linear-gradient(145deg,#191919,#050505);
    border: 1px solid #ff6a00;
    box-shadow:
        0 0 35px rgba(255,80,0,.18),
        0 25px 70px #000;
}

/* LOGO */

.logo-container {
    width: 190px;
    height: 190px;
    margin: auto;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ff6a00;
    box-shadow:
        0 0 20px rgba(255,80,0,.45),
        0 0 45px rgba(255,80,0,.15);
}

.logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* LIVE */

.live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 18px 0;
    padding: 7px 15px;
    border-radius: 20px;
    color: #ff7b00;
    border: 1px solid #ff6a00;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

.dot {
    width: 8px;
    height: 8px;
    background: #ff2600;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff2600;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% { opacity:.3; }
}

/* DISCO */

.disco {
    width: 150px;
    height: 150px;
    margin: 5px auto 15px;
    padding: 7px;
    border-radius: 50%;
    background:
        repeating-radial-gradient(
            circle,
            #050505 0px,
            #161616 3px,
            #050505 5px
        );
    border: 3px solid #333;
    box-shadow:
        0 0 0 2px #ff6a00,
        0 10px 35px #000;
}

.disco.playing {
    animation: rotate 3s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.disco-center {
    width: 55px;
    height: 55px;
    margin: 38px auto;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        #ffb300,
        #ff5200 45%,
        #111 47%
    );
    border: 3px solid #222;
}

/* EQUALIZER */

.equalizer {
    height: 45px;
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 4px;
    margin: 15px 0;
}

.bar {
    width: 5px;
    height: 7px;
    background: linear-gradient(#ffb300,#ff3d00);
    border-radius: 5px;
}

.equalizer.active .bar {
    animation: eq .55s infinite alternate ease-in-out;
}

.bar:nth-child(1){animation-delay:.1s}
.bar:nth-child(2){animation-delay:.3s}
.bar:nth-child(3){animation-delay:.15s}
.bar:nth-child(4){animation-delay:.4s}
.bar:nth-child(5){animation-delay:.05s}
.bar:nth-child(6){animation-delay:.25s}
.bar:nth-child(7){animation-delay:.45s}
.bar:nth-child(8){animation-delay:.2s}
.bar:nth-child(9){animation-delay:.35s}
.bar:nth-child(10){animation-delay:.1s}
.bar:nth-child(11){animation-delay:.3s}

@keyframes eq {
    from {height:6px}
    to {height:42px}
}

/* TEXTO */

.station {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.now {
    margin-top: 5px;
    color: #999;
    font-size: 11px;
    letter-spacing: 1px;
}

/* CONTROLES */

.controls {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.play {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 25px;
    background: linear-gradient(145deg,#ffb300,#ff4b00);
    color: white;
    box-shadow: 0 0 25px rgba(255,80,0,.4);
    transition: .2s;
}

.play:hover {
    transform: scale(1.08);
}

.volume {
    width: 100px;
    accent-color: #ff6a00;
}

.status {
    margin-top: 15px;
    color: #777;
    font-size: 11px;
}

.status.live {
    color: #ff8500;
}

.footer {
    margin-top: 15px;
    color: #555;
    font-size: 9px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="player">

    <div class="logo-container">
        <img
            src="arena24-logo.jpeg"
            class="logo"
            alt="RADIO ARENA 24">
    </div>

    <div class="live">
        <span class="dot"></span>
        EN VIVO
    </div>

    <div class="disco" id="disco">
        <div class="disco-center"></div>
    </div>

    <div class="station">
        RADIO ARENA 24
    </div>

    <div class="now">
        LA RIOJA · ARGENTINA
    </div>

    <div class="equalizer" id="equalizer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </div>

    <audio
        id="radio"
        src="https://stream.zeno.fm/zuw6xmmwmd0uv"
        preload="none">
    </audio>

    <div class="controls">

        <button class="play" id="play">
            ▶
        </button>

        <input
            class="volume"
            id="volume"
            type="range"
            min="0"
            max="1"
            step=".01"
            value=".8">

    </div>

    <div class="status" id="status">
        LISTO PARA ESCUCHAR
    </div>

    <div class="footer">
        RADIO ARENA 24 · STREAMING ONLINE
    </div>

</div>

<script>

const radio = document.getElementById("radio");
const play = document.getElementById("play");
const disco = document.getElementById("disco");
const equalizer = document.getElementById("equalizer");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

radio.volume = .8;

play.addEventListener("click", async () => {

    if (radio.paused) {

        try {

            await radio.play();

            play.innerHTML = "❚❚";

            disco.classList.add("playing");
            equalizer.classList.add("active");

            status.innerHTML = "● REPRODUCIENDO EN VIVO";
            status.classList.add("live");

        } catch(e) {

            status.innerHTML = "NO SE PUDO CONECTAR";

        }

    } else {

        radio.pause();

        play.innerHTML = "▶";

        disco.classList.remove("playing");
        equalizer.classList.remove("active");

        status.innerHTML = "PAUSADO";
        status.classList.remove("live");
    }

});

volume.addEventListener("input", () => {
    radio.volume = volume.value;
});

radio.addEventListener("waiting", () => {
    status.innerHTML = "CONECTANDO...";
});

radio.addEventListener("playing", () => {
    status.innerHTML = "● REPRODUCIENDO EN VIVO";
    status.classList.add("live");
});

radio.addEventListener("error", () => {
    status.innerHTML = "SEÑAL NO DISPONIBLE";
    status.classList.remove("live");
});

</script>

</body>
</html>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

    align-items:center;

.brand{

.brand span{

.live{

.video-box{

    width:100%;

.video-box iframe{

    height:100%;

    left:0;
    top:0;

    border:0;

.info{

    display:flex;

    font-size:12px;
}

.program{

    color:#fff;

    font-weight:bold;

    letter-spacing:1px;
}

.location{

    color:#ff6a00;

    font-weight:bold;
}

/* LINEA */

.line{

    width:100%;
    height:2px;

    margin-top:10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff5a00,
            transparent
        );

}

/* FOOTER */

.footer{

    text-align:center;

    margin-top:13px;

    color:#555;

    font-size:9px;

    letter-spacing:3px;
}

</style>
</head>


<body>

<div class="tv-player">

    <div class="header">

        <div class="brand">
            TV <span>ARENA 24</span>
        </div>

        <div class="live">
            <span class="dot"></span>
            EN VIVO
        </div>

    </div>


    <div class="video-box">

        <iframe

            src="https://www.youtube-nocookie.com/embed/i16rESsSqE8?autoplay=0&playsinline=1&rel=0"

            title="TV ARENA 24"

            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

            allowfullscreen>

        </iframe>

    </div>


    <div class="info">

        <div class="program">
            📺 TV ARENA 24
        </div>

        <div class="location">
            LA RIOJA · ARGENTINA
        </div>

    </div>

    <div class="line"></div>

    <div class="footer">
        TV ARENA 24 · INFORMACIÓN · NOTICIAS · ENTRETENIMIENTO
    </div>

</div>


</body>
</html>
