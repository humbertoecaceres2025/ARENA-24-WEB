<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO ARENA 24</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle, #252525 0%, #090909 55%, #000 100%);
    font-family: Arial, sans-serif;
}

.player {
    width: 390px;
    max-width: 94%;
    padding: 25px;
    text-align: center;
    color: white;
    border-radius: 28px;
    background: linear-gradient(145deg,#191919,#050505);
    border: 1px solid #ff6a00;
    box-shadow:
        0 0 35px rgba(255,80,0,.18),
        0 25px 70px #000;
}

/* LOGO */

.logo-container {
    width: 190px;
    height: 190px;
    margin: auto;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ff6a00;
    box-shadow:
        0 0 20px rgba(255,80,0,.45),
        0 0 45px rgba(255,80,0,.15);
}

.logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* LIVE */

.live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 18px 0;
    padding: 7px 15px;
    border-radius: 20px;
    color: #ff7b00;
    border: 1px solid #ff6a00;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

.dot {
    width: 8px;
    height: 8px;
    background: #ff2600;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff2600;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% { opacity:.3; }
}

/* DISCO */

.disco {
    width: 150px;
    height: 150px;
    margin: 5px auto 15px;
    padding: 7px;
    border-radius: 50%;
    background:
        repeating-radial-gradient(
            circle,
            #050505 0px,
            #161616 3px,
            #050505 5px
        );
    border: 3px solid #333;
    box-shadow:
        0 0 0 2px #ff6a00,
        0 10px 35px #000;
}

.disco.playing {
    animation: rotate 3s linear infinite;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.disco-center {
    width: 55px;
    height: 55px;
    margin: 38px auto;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        #ffb300,
        #ff5200 45%,
        #111 47%
    );
    border: 3px solid #222;
}

/* EQUALIZER */

.equalizer {
    height: 45px;
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 4px;
    margin: 15px 0;
}

.bar {
    width: 5px;
    height: 7px;
    background: linear-gradient(#ffb300,#ff3d00);
    border-radius: 5px;
}

.equalizer.active .bar {
    animation: eq .55s infinite alternate ease-in-out;
}

.bar:nth-child(1){animation-delay:.1s}
.bar:nth-child(2){animation-delay:.3s}
.bar:nth-child(3){animation-delay:.15s}
.bar:nth-child(4){animation-delay:.4s}
.bar:nth-child(5){animation-delay:.05s}
.bar:nth-child(6){animation-delay:.25s}
.bar:nth-child(7){animation-delay:.45s}
.bar:nth-child(8){animation-delay:.2s}
.bar:nth-child(9){animation-delay:.35s}
.bar:nth-child(10){animation-delay:.1s}
.bar:nth-child(11){animation-delay:.3s}

@keyframes eq {
    from {height:6px}
    to {height:42px}
}

/* TEXTO */

.station {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.now {
    margin-top: 5px;
    color: #999;
    font-size: 11px;
    letter-spacing: 1px;
}

/* CONTROLES */

.controls {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.play {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 25px;
    background: linear-gradient(145deg,#ffb300,#ff4b00);
    color: white;
    box-shadow: 0 0 25px rgba(255,80,0,.4);
    transition: .2s;
}

.play:hover {
    transform: scale(1.08);
}

.volume {
    width: 100px;
    accent-color: #ff6a00;
}

.status {
    margin-top: 15px;
    color: #777;
    font-size: 11px;
}

.status.live {
    color: #ff8500;
}

.footer {
    margin-top: 15px;
    color: #555;
    font-size: 9px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="player">

    <div class="logo-container">
        <img
            src="arena24-logo.jpeg"
            class="logo"
            alt="RADIO ARENA 24">
    </div>

    <div class="live">
        <span class="dot"></span>
        EN VIVO
    </div>

    <div class="disco" id="disco">
        <div class="disco-center"></div>
    </div>

    <div class="station">
        RADIO ARENA 24
    </div>

    <div class="now">
        LA RIOJA · ARGENTINA
    </div>

    <div class="equalizer" id="equalizer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </div>

    <audio
        id="radio"
        src="https://stream.zeno.fm/zuw6xmmwmd0uv"
        preload="none">
    </audio>

    <div class="controls">

        <button class="play" id="play">
            ▶
        </button>

        <input
            class="volume"
            id="volume"
            type="range"
            min="0"
            max="1"
            step=".01"
            value=".8">

    </div>

    <div class="status" id="status">
        LISTO PARA ESCUCHAR
    </div>

    <div class="footer">
        RADIO ARENA 24 · STREAMING ONLINE
    </div>

</div>

<script>

const radio = document.getElementById("radio");
const play = document.getElementById("play");
const disco = document.getElementById("disco");
const equalizer = document.getElementById("equalizer");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

radio.volume = .8;

play.addEventListener("click", async () => {

    if (radio.paused) {

        try {

            await radio.play();

            play.innerHTML = "❚❚";

            disco.classList.add("playing");
            equalizer.classList.add("active");

            status.innerHTML = "● REPRODUCIENDO EN VIVO";
            status.classList.add("live");

        } catch(e) {

            status.innerHTML = "NO SE PUDO CONECTAR";

        }

    } else {

        radio.pause();

        play.innerHTML = "▶";

        disco.classList.remove("playing");
        equalizer.classList.remove("active");

        status.innerHTML = "PAUSADO";
        status.classList.remove("live");
    }

});

volume.addEventListener("input", () => {
    radio.volume = volume.value;
});

radio.addEventListener("waiting", () => {
    status.innerHTML = "CONECTANDO...";
});

radio.addEventListener("playing", () => {
    status.innerHTML = "● REPRODUCIENDO EN VIVO";
    status.classList.add("live");
});

radio.addEventListener("error", () => {
    status.innerHTML = "SEÑAL NO DISPONIBLE";
    status.classList.remove("live");
});

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO ARENA 24 - Streaming</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #292929 0%, #111 45%, #050505 100%);
    font-family: Arial, Helvetica, sans-serif;
}

.radio-player {
    width: min(94%, 430px);
    padding: 30px 25px;
    border-radius: 28px;
    background: linear-gradient(145deg, #191919, #080808);
    border: 1px solid rgba(212,175,55,.45);
    box-shadow:
        0 25px 70px rgba(0,0,0,.8),
        0 0 35px rgba(212,175,55,.12);
    color: white;
    text-align: center;
}

/* LOGO / NOMBRE */
.logo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #d4af37;
    text-shadow: 0 0 18px rgba(212,175,55,.35);
}

.subtitle {
    margin-top: 5px;
    color: #aaa;
    font-size: 12px;
    letter-spacing: 3px;
}

/* EN VIVO */
.live {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin: 20px 0;
    padding: 7px 13px;
    border-radius: 30px;
    background: rgba(212,175,55,.1);
    border: 1px solid rgba(212,175,55,.35);
    color: #d4af37;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

.live-dot {
    width: 8px;
    height: 8px;
    background: #e53935;
    border-radius: 50%;
    box-shadow: 0 0 10px #e53935;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    50% { opacity: .35; }
}

/* DISCO */
.record-container {
    width: 220px;
    height: 220px;
    margin: 5px auto 25px;
    position: relative;
}

.record {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
        repeating-radial-gradient(
            circle,
            #111 0px,
            #111 3px,
            #1b1b1b 4px,
            #080808 7px
        );
    border: 8px solid #0b0b0b;
    box-shadow:
        0 0 0 2px #333,
        0 15px 35px rgba(0,0,0,.8);
    position: relative;
}

.record.playing {
    animation: spin 3s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.record::after {
    content: "";
    position: absolute;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background:
        radial-gradient(circle, #f5d76e 0 12%,
        #d4af37 13% 45%,
        #8f7220 46% 100%);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px rgba(212,175,55,.35);
}

.record::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #111;
    border-radius: 50%;
    z-index: 3;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

/* ECUALIZADOR */
.equalizer {
    height: 48px;
    display: flex;
    justify-content: center;
    align-items: end;
    gap: 5px;
    margin: 10px 0 25px;
}

.bar {
    width: 5px;
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(to top, #8f7220, #f5d76e);
    transition: height .12s ease;
}

.playing .bar {
    animation: equalize .7s ease-in-out infinite alternate;
}

.bar:nth-child(1) { animation-delay: -.1s; }
.bar:nth-child(2) { animation-delay: -.3s; }
.bar:nth-child(3) { animation-delay: -.5s; }
.bar:nth-child(4) { animation-delay: -.2s; }
.bar:nth-child(5) { animation-delay: -.6s; }
.bar:nth-child(6) { animation-delay: -.4s; }
.bar:nth-child(7) { animation-delay: -.7s; }
.bar:nth-child(8) { animation-delay: -.25s; }
.bar:nth-child(9) { animation-delay: -.55s; }
.bar:nth-child(10) { animation-delay: -.15s; }
.bar:nth-child(11) { animation-delay: -.45s; }

@keyframes equalize {
    from { height: 7px; }
    to { height: 43px; }
}

/* CONTROLES */
.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
}

.play-button {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    color: #111;
    background: linear-gradient(145deg, #f5d76e, #b8860b);
    box-shadow:
        0 8px 25px rgba(212,175,55,.25),
        inset 0 1px 2px rgba(255,255,255,.6);
    font-size: 25px;
    transition: .2s;
}

.play-button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 30px rgba(212,175,55,.45);
}

.volume {
    width: 100px;
    accent-color: #d4af37;
    cursor: pointer;
}

/* ESTADO */
.status {
    margin-top: 20px;
    font-size: 12px;
    color: #777;
}

.status.active {
    color: #d4af37;
}

/* FOOTER */
.footer {
    margin-top: 20px;
    color: #555;
    font-size: 10px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="radio-player">

    <div class="logo">RADIO ARENA 24</div>
    <div class="subtitle">STREAMING</div>

    <div class="live">
        <span class="live-dot"></span>
        EN VIVO
    </div>

    <div class="record-container">
        <div class="record" id="record"></div>
    </div>

    <div class="equalizer" id="equalizer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </div>

    <audio
        id="radio"
        src="https://stream.zeno.fm/zuw6xmmwmd0uv"
        preload="none">
    </audio>

    <div class="controls">

        <button class="play-button" id="playButton" aria-label="Reproducir">
            ▶
        </button>

        <input
            class="volume"
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
            aria-label="Volumen">

    </div>

    <div class="status" id="status">
        LISTO PARA ESCUCHAR
    </div>

    <div class="footer">
        RADIO ARENA 24 · STREAMING ONLINE
    </div>

</div>

<script>
const radio = document.getElementById("radio");
const playButton = document.getElementById("playButton");
const record = document.getElementById("record");
const equalizer = document.getElementById("equalizer");
const volume = document.getElementById("volume");
const status = document.getElementById("status");

radio.volume = 0.8;

playButton.addEventListener("click", async () => {

    if (radio.paused) {

        try {
            await radio.play();

            playButton.textContent = "❚❚";
            record.classList.add("playing");
            equalizer.classList.add("playing");

            status.textContent = "REPRODUCIENDO EN VIVO";
            status.classList.add("active");

        } catch (error) {

            status.textContent = "NO SE PUDO CONECTAR";
            status.classList.remove("active");

            console.error(error);
        }

    } else {

        radio.pause();

        playButton.textContent = "▶";
        record.classList.remove("playing");
        equalizer.classList.remove("playing");

        status.textContent = "PAUSADO";
        status.classList.remove("active");
    }
});

volume.addEventListener("input", () => {
    radio.volume = volume.value;
});

radio.addEventListener("waiting", () => {
    status.textContent = "CONECTANDO...";
});

radio.addEventListener("playing", () => {
    status.textContent = "REPRODUCIENDO EN VIVO";
    status.classList.add("active");
});

radio.addEventListener("error", () => {
    status.textContent = "SEÑAL NO DISPONIBLE";
    status.classList.remove("active");
});
</script>

</body>
</html>
